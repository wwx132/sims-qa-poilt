[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sims-qa-pilot"
version = "0.1.0"
description = "SIMS project single-turn natural-language data query pilot"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<2",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "pymysql>=1.1,<2",
  "sqlglot>=25,<30",
  "mcp>=1,<2"
]

[tool.setuptools.packages.find]
where = ["src"]
